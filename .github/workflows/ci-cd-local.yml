name: CI/CD Local Sock Shop (carts)

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

env:
  IMAGE_NAME: sockshop-carts:local

jobs:
  ci:
    name: Integracao Continua (build e testes)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependencias
        run: npm install
        working-directory: ./services/carts

      - name: Executar testes
        run: npm test
        working-directory: ./services/carts

  cd_local:
    name: Entrega Continua (container local)
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/master'
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Build da imagem Docker local
        run: docker build -t $IMAGE_NAME ./services/carts

      - name: Parar container anterior (se existir)
        run: |
          docker stop sockshop-carts || true
          docker rm sockshop-carts || true

      - name: Subir novo container local
        run: |
          docker run -d --name sockshop-carts -p 8080:80 $IMAGE_NAME